version: 1
setup_command: ''
paths:
  '**':
    domains:
    - core
  '*.sh':
    domains:
    - core
scenarios:
- id: ADOPTED-TEST-001
  cost: medium
  estimated_seconds: 180
  timeout_seconds: 600
  agent_default: true
  scope: integration
  name: Installer safety smoke
  level: integration
  domains:
  - core
  triggers:
  - affected
  platforms:
  - linux
  command: bash tests/engineering-safe-smoke.sh
  invariants:
  - installer scripts remain syntax-valid and preserve DRY_RUN plus strict shell safety markers
  release_gate: true
- id: ADOPTED-STATIC-001
  cost: cheap
  estimated_seconds: 2
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Git whitespace validation
  level: static
  domains:
  - core
  triggers:
  - pr
  - preflight
  - release
  platforms:
  - linux
  command: bash -lc 'if [ -n "${ENGINEERING_BASE_REF:-}" ]; then git diff --check
    "${ENGINEERING_BASE_REF}...HEAD"; elif git rev-parse --verify --quiet origin/main
    >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify
    --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse
    --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git
    diff --check; fi'
  invariants:
  - committed candidate/base diff has no whitespace errors
  release_gate: true

- id: AIO-SENSOR-STORAGE-001
  cost: cheap
  estimated_seconds: 5
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: AIO plus Sensor mixed-storage regression
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  platforms:
  - linux
  command: bash tests/aio-sensor-storage-regression.sh
  invariants:
  - AIO root stays at 545GiB while Sensor fits post-AIO ubuntu-vg free capacity
  - NVMe partition selection, zero-byte virtual disk exclusion, and DRY_RUN remain safe
  release_gate: true

- id: AIO-MDS-NUMA-001
  cost: cheap
  estimated_seconds: 8
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: AIO NUMA0 and MDS NUMA1 CPU/memory regression
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  platforms:
  - linux
  command: bash tests/aio-mds-numa-regression.sh
  invariants:
  - NUMA range lists resolve to exact online CPU IDs for all VM vCPUs
  - AIO binds CPU and memory to node0 and MDS to node1 without partial success
  - DRY_RUN never writes NUMA state and default AIO root LV remains 545GiB
  release_gate: true
